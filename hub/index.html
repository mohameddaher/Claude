<title>CLS Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: navy slide-out sidebar grouped by department, sticky top bar, hero carousel + department heroes, card dashboard. */
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#142036; --muted:#5F6C86; --line:#DFE5EF; --soft:#EDF1F7; --field:#FFFFFF;
  --side:#0A1A33; --side-2:#12284B; --side-ink:#C6D3EA; --side-muted:#7E90B2;
  --noc:#2563EB; --gen:#D97706; --sec:#0D9488; --common:#7C3AED; --mgmt:#0F172A;
  --ok:#15803D; --warn:#B45309; --bad:#C81E1E; --info:#1D4ED8;
  --accent:#2563EB;
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,30,60,.05),0 8px 24px -16px rgba(16,30,60,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#081120; --card:#101B2E; --ink:#E5ECF8; --muted:#8D9BB7; --line:#213150; --soft:#16233A; --field:#0B1628;
  --side:#050C18; --side-2:#0E1D36; --side-ink:#C6D3EA; --side-muted:#7385A8;
  --noc:#5B8DEF; --gen:#F59E0B; --sec:#2DD4BF; --common:#A78BFA; --mgmt:#CBD5E1;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --info:#7AA7FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.8); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#081120; --card:#101B2E; --ink:#E5ECF8; --muted:#8D9BB7; --line:#213150; --soft:#16233A; --field:#0B1628;
  --side:#050C18; --side-2:#0E1D36; --side-ink:#C6D3EA; --side-muted:#7385A8;
  --noc:#5B8DEF; --gen:#F59E0B; --sec:#2DD4BF; --common:#A78BFA; --mgmt:#CBD5E1;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --info:#7AA7FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.8); color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.acc{color:color-mix(in srgb,var(--accent) 78%,var(--ink))}
.mono{font-family:var(--mono);font-size:.93em}

/* Sidebar */
.side{position:fixed;inset:0 auto 0 0;width:272px;background:linear-gradient(180deg,var(--side),var(--side-2));color:var(--side-ink);display:flex;flex-direction:column;z-index:40;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 12px}
.logo{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff;background:conic-gradient(from 200deg,#2563EB,#0D9488,#D97706,#2563EB);position:relative}
.logo::after{content:"";position:absolute;inset:3px;border-radius:10px;background:#0A1A33}
.logo svg{position:relative;z-index:1}
.brand b{font-family:var(--display);font-size:17px;color:#fff;display:block;line-height:1.15;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--side-muted)}
.sidenav{overflow-y:auto;padding:4px 10px 16px;flex:1;scrollbar-width:thin}
.grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px;font-weight:600;display:flex;align-items:center;gap:7px}
.grp i{width:8px;height:8px;border-radius:3px;background:var(--gc)}
.nv{--c:#60A5FA;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-ink);padding:7px 10px;border-radius:9px;text-align:left;font-size:13.5px;font-weight:500;transition:background .15s,transform .15s}
.nv .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 26%,transparent);color:color-mix(in srgb,var(--c) 55%,#fff)}
.nv:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}
.nv[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--c)}
.nv[aria-current="page"] .ic{background:var(--c);color:#fff}
.nv .n{margin-left:auto;background:var(--c);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.nv span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidefoot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--side-muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#7E90B2;flex:none}
.dot.on{background:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.2)}
.scrim{position:fixed;inset:0;background:rgba(5,12,24,.55);z-index:35;border:0}

/* Top bar + main */
.wrap{margin-left:272px;min-width:0}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 24px;min-height:60px}
.burger{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;place-items:center;flex:none}
.crumb{min-width:0;margin-right:auto}
.crumb small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.crumb b{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.navchip{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card);white-space:nowrap}
.navchip b{color:var(--ink);font-weight:600}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--soft);flex:none}
.theme button{border:0;background:transparent;border-radius:999px;width:32px;height:28px;display:grid;place-items:center;color:var(--muted)}
.theme button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
main{padding-block:22px 64px;padding-inline:24px;max-width:1400px}
#view{animation:enter .35s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:translateY(8px)}to{transform:none}}
.band{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 30%,var(--card)));margin-bottom:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2.title{font-family:var(--display);font-size:27px;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:3px 0 0;max-width:74ch}
h3{font-family:var(--display);font-size:16.5px;font-weight:600;margin:26px 0 12px}
.card h3{margin-top:0}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.stat{--c:var(--accent);position:relative;overflow:hidden;transition:transform .18s,border-color .18s}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.stat .d{font-size:12.5px;color:var(--muted)}
.stat[data-goto]{cursor:pointer}
.stat[data-goto]:hover{border-color:var(--c);transform:translateY(-2px)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,var(--card))}
.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,var(--card))}
.neutral{color:var(--muted);background:var(--soft)}
.tag{display:inline-block;background:color-mix(in srgb,var(--accent) 11%,var(--card));color:color-mix(in srgb,var(--accent) 80%,var(--ink));font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0}

.btn{border:0;background:var(--accent);color:#fff;padding:9px 15px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:#C81E1E}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:30px;height:30px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);background:var(--soft)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--card)}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1;min-width:160px;max-width:340px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--field)}
.count{color:var(--muted);font-size:12.5px;margin-left:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:620px}
th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--card))}
td.act{white-space:nowrap;text-align:right;width:1%}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.clip{max-width:300px}
.hint{color:var(--muted);font-size:12px;font-weight:400}

/* Hero carousel */
.carousel{position:relative;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.slides{display:flex;transition:transform .7s cubic-bezier(.65,0,.35,1)}
.slide{flex:0 0 100%;min-width:0}
.hero{position:relative;overflow:hidden;border-radius:22px;color:#EAF4FF;padding:28px 30px 26px;isolation:isolate}
.carousel .hero{border-radius:0;padding-bottom:58px;min-height:100%}
.hero.h-cls{background:radial-gradient(120% 140% at 100% 0%,#1E3A8A 0%,#0B1E3F 45%,#050D1C 100%)}
.hero.h-noc{background:radial-gradient(120% 140% at 0% 0%,#1E5BD8 0%,#0B2C6B 42%,#061633 100%)}
.hero.h-gen{background:radial-gradient(120% 140% at 0% 100%,#B45309 0%,#5A2A06 45%,#1C0E04 100%)}
.hero.h-sec{background:radial-gradient(120% 140% at 100% 100%,#0F766E 0%,#0B3B3A 45%,#05181A 100%)}
.hero h2{font-family:var(--display);font-size:clamp(26px,4vw,42px);margin:6px 0 6px;font-weight:800;letter-spacing:-.025em;line-height:1.05;color:#fff;text-wrap:balance}
.hero p{margin:0;color:rgba(234,244,255,.78);max-width:62ch}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#7DD3FC;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.h-gen .eyebrow{color:#FCD34D}.h-sec .eyebrow{color:#5EEAD4}
.live{display:inline-flex;align-items:center;gap:6px;color:#86EFAC}
.live i{width:8px;height:8px;border-radius:50%;background:#22C55E;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:center;margin-top:16px}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.herostats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.hs{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;cursor:pointer;text-align:left;color:inherit;transition:background .2s,transform .2s}
.hs:hover{background:rgba(255,255,255,.15);transform:translateY(-2px)}
.hs b{font-family:var(--display);font-size:26px;display:block;color:#fff;line-height:1.15}
.hs span{font-size:12px;color:rgba(234,244,255,.72)}
.cnav{position:absolute;left:0;right:0;bottom:14px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:3}
.cdot{width:9px;height:9px;border-radius:999px;border:0;background:rgba(255,255,255,.35);padding:0;transition:width .3s,background .3s}
.cdot[aria-current="true"]{width:28px;background:#fff}
.carr{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;display:grid;place-items:center}
.carr:hover{background:rgba(0,0,0,.45)}
.cprog{position:absolute;left:0;top:0;height:3px;background:rgba(255,255,255,.7);z-index:3;width:0}
.cprog.run{animation:prog 8s linear forwards}
@keyframes prog{to{width:100%}}
.route{display:block;width:100%;height:auto}
.route .flow{stroke-dasharray:2 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.tankwrap{display:flex;gap:24px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.tank .lbl{font-weight:600;margin-top:6px;text-align:center}
.tank .amt{color:var(--muted);font-size:13px;text-align:center}
.hero .tank .amt{color:rgba(255,255,255,.75)}.hero .tank .lbl{color:#fff}
.wave{animation:wave 3.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-18px)}}
.radar{width:100%;max-width:260px;height:auto;display:block;margin:auto}
.radar .sweep{transform-origin:130px 130px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.radar .blip{animation:blink 4s linear infinite}
@keyframes blink{0%,100%{opacity:.25}10%{opacity:1}40%{opacity:.4}}
.duty{border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.05)}
.duty .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(234,244,255,.6)}
.duty .sh{font-family:var(--display);font-size:22px;font-weight:700;color:#fff;line-height:1.15;margin:2px 0 6px}
.duty ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.duty li{display:flex;align-items:center;gap:9px;color:#fff}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none;background:var(--c,var(--noc));color:#fff}

/* Department strip + tiles */
.depts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.dept{--c:var(--noc);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dept::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:color-mix(in srgb,var(--c) 12%,transparent)}
.dept header{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.dept header .ic{width:36px;height:36px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center}
.dept header b{font-family:var(--display);font-size:16px;display:block;line-height:1.15}
.dept header small{color:var(--muted);font-size:12px}
.dept .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;position:relative;z-index:1}
.dept .row b{font-weight:600}
.dept .go{margin-top:10px;position:relative;z-index:1}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{--c:var(--accent);display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:9px 14px;background:var(--card);cursor:pointer;text-align:left;width:100%;transition:background .15s,transform .15s}
.alert:hover{background:var(--soft);transform:translateX(3px)}
.alert b{display:block;font-weight:600}
.alert small{color:var(--muted);font-size:12.5px}
.alert i{margin-left:auto;font-style:normal;font-weight:600;font-size:12.5px;color:color-mix(in srgb,var(--c) 70%,var(--ink));white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tile{--c:var(--accent);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));background:color-mix(in srgb,var(--c) 8%,var(--card));border-radius:14px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center;transition:transform .18s,background .18s}
.tile:hover{background:color-mix(in srgb,var(--c) 16%,var(--card));transform:translateY(-2px)}
.tile .ic{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.tile small{color:var(--muted);font-size:12px}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr 54px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:8px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(.05)}to{transform:none}}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar b{text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg .ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
svg .gl{stroke:var(--line)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:480px;height:auto}

/* Schedule */
.sched{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;align-items:center;min-width:560px}
.sched .lane{position:relative;height:30px;background:var(--soft);border-radius:8px;overflow:hidden}
.sched .blk{position:absolute;top:3px;bottom:3px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.sched .blk.now{box-shadow:0 0 0 2px var(--ink)}
.sched .nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.sched .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono)}
.shtable td,.shtable th{font-size:13.5px}
.shtable tr.now td{background:color-mix(in srgb,var(--ok) 10%,var(--card));font-weight:600}

/* Port faceplates */
.plate{background:#0C1626;border-radius:14px;padding:14px;border:1px solid #22324F;overflow-x:auto}
.plate .cap{color:#9FB2D4;font-size:12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plate .cap b{color:#fff;font-family:var(--display);font-size:14px}
.ports{display:grid;grid-template-columns:repeat(8,minmax(52px,1fr));gap:7px;min-width:460px}
.ports.free{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));min-width:0}
.port{border:1px solid #2C3F61;background:#14233B;border-radius:8px;padding:6px 4px 5px;text-align:center;color:#9FB2D4;font-family:var(--mono);font-size:12px;line-height:1.2}
.port:hover{border-color:#fff}
.port .led{display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 4px;background:#52627F}
.port small{display:block;font-family:var(--body);font-size:9.5px;color:#7E90B2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port.up{color:#fff;background:#0F3B2E;border-color:#1F7A5A}.port.up .led{background:#34D399;box-shadow:0 0 6px #34D399;animation:led 2.4s ease-in-out infinite}
@keyframes led{50%{opacity:.55}}
.port.down{background:#3A1A1F;border-color:#7A2E38;color:#F3C4C9}.port.down .led{background:#F87171}

/* Org chart */
.orgtree{display:flex;flex-direction:column;align-items:center;gap:0;overflow-x:auto;padding:4px 0}
.on{border:1.5px solid color-mix(in srgb,var(--c,var(--accent)) 40%,var(--line));background:color-mix(in srgb,var(--c,var(--accent)) 9%,var(--card));border-radius:12px;padding:9px 16px;text-align:center;min-width:200px;max-width:320px}
.on b{display:block;font-weight:600}
.on span{font-size:12.5px;color:var(--muted)}
.on.lead{background:var(--c);border-color:var(--c);color:#fff}.on.lead span{color:rgba(255,255,255,.82)}
.ol{width:2px;height:22px;background:color-mix(in srgb,var(--muted) 45%,var(--line))}
.ocols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;width:100%;border-top:2px solid color-mix(in srgb,var(--muted) 45%,var(--line));padding-top:16px}
.ocol{--c:var(--noc);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:14px;padding:10px;background:color-mix(in srgb,var(--c) 5%,var(--card))}
.ocol h4{margin:0 0 8px;font-family:var(--display);font-size:14px;color:color-mix(in srgb,var(--c) 80%,var(--ink));display:flex;justify-content:space-between}
.person{display:flex;gap:9px;align-items:center;padding:6px 4px;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.person b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.person small{color:var(--muted);font-size:12px}
.progress{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;min-width:90px}
.progress i{display:block;height:100%;background:var(--c,var(--accent));border-radius:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;background:var(--card)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.timeline{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .b{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--gen);color:var(--gen);background:var(--card)}
.step.done .b{background:var(--gen);color:#fff}
.step.pred .b{border-style:dashed}
.step .t{font-weight:600}
.step .s{color:var(--muted);font-size:13px}
.stars{color:#F59E0B;letter-spacing:1px}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(5,12,24,.55);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:640px;border-top:6px solid var(--accent);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(10px) scale(.98)}to{transform:none}}
.modal header{padding:16px 20px 2px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal h4{margin:0;font-family:var(--display);font-size:19px}
.modal .body{padding:10px 20px}
.modal footer{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label,.form .lbl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--field);color:var(--ink);font-weight:400;font-size:14.5px;width:100%}
.form textarea{min-height:72px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0A1A33;color:#fff;padding:10px 18px;border-radius:12px;z-index:70;max-width:90vw;border:1px solid #2C3F61;animation:pop .2s ease-out}

@media (max-width:1000px){
  .side{transform:translateX(-100%)} .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .wrap{margin-left:0} .burger{display:grid}
  .nav{padding-inline:16px} main{padding-inline:16px}
  .navchip.opt{display:none}
}
@media (max-width:560px){.form{grid-template-columns:1fr} h2.title{font-size:23px} .hero{padding:22px 18px 22px} .carousel .hero{padding-bottom:60px} .bar{grid-template-columns:1fr 1fr 48px} .navchip{display:none} .carr{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const tmin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
function inShift(s,m){const a=tmin(s.from),b=tmin(s.to);return a<b?m>=a&&m<b:m>=a||m<b}
function curShift(dept){const S=SCHED[dept];if(!S)return null;const m=nowMin();return S.shifts.find(s=>inShift(s,m))||null}
function fmt12(t){const [h,m]=t.split(":").map(Number);return ((h+11)%12+1)+":"+String(m).padStart(2,"0")+" "+(h<12?"AM":"PM")}
function onShift(dept){const s=curShift(dept);if(!s)return [];const keys=s.k.split(/\s*&\s*/);return byDept(dept).filter(p=>p.shift&&(p.shift===s.k||keys.includes(p.shift)))}
function shiftEnds(s){return s?fmt12(s.to):""}

function tstat(p){return p==null?"":p===0?"No traffic":p<=50?"Low":p<=89?"Mid":"High"}
function ttone(p){return p==null?"neutral":p===0?"neutral":p<=50?"info":p<=89?"ok":"bad"}
function tcolor(p){return p==null||p===0?"var(--muted)":p<=50?"#0EA5E9":p<=89?"#16A34A":"#DC2626"}
function clr(r){const e=r.expires?parseD(r.expires):r.issued?addMonths(parseD(r.issued),3):null;return {exp:e,days:e?diff(today(),e):null}}
function clrPill(r){const c=clr(r);if(c.days==null)return pill("No date recorded","neutral");if(c.days<0)return pill("Expired "+Math.abs(c.days)+" days ago","bad");if(c.days<=14)return pill("Renew now, "+c.days+" days left","warn");return pill("Valid, "+c.days+" days left","ok")}
function remain(r){return (num(r.stockIn)||0)-(num(r.stockOut)||0)}
function bal(r){return (num(r.forward)||0)+(num(r.initial)||0)-(num(r.taken)||0)}
function envPill(metric,v){if(v==null)return "—";if(metric==="temp")return v>27?pill("High","bad"):v<10?pill("Low","info"):pill("Normal","ok");return v>70?pill("High","warn"):v<30?pill("Low","info"):pill("Normal","ok")}

function dueCell(r,done){if(!r.due)return "—";return r.status!==done&&parseD(r.due)<today()?pill(fd(r.due)+", overdue","bad"):fd(r.due)}
function dur(r){if(!r.start||!r.end)return r.start&&r.status!=="Resolved"?pill("Ongoing","bad"):"—";const m=Math.round((new Date(r.end)-new Date(r.start))/6e4);if(!(m>=0))return "—";return m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min"}
function pdays(r){if(num(r.days)!=null)return num(r.days);const a=parseD(r.from),b=parseD(r.to);return a&&b?diff(a,b)+1:"—"}
/* ---------- generic table ---------- */
const CTX={};const searchQ={};
function table(key,col,o){o=o||{};CTX[key]={col,preset:o.preset||{},filter:o.filter,cols:o.cols||SCHEMAS[col].cols,title:o.title||SCHEMAS[col].title};
  return `<div class="tools"><input class="search" id="q-${key}" type="search" placeholder="Search" data-search="${key}" value="${esc(searchQ[key]||"")}"><button class="btn" data-add="${key}">+ Add ${esc(CTX[key].title)}</button>${downloads?`<button class="btn ghost" data-csv="${key}">Export CSV</button>`:""}<span class="count" id="cnt-${key}"></span></div><div class="tablewrap" id="tbl-${key}">${tbody(key)}</div>`}
function rowsFor(key){const c=CTX[key],S=SCHEMAS[c.col];let rows=[...data[c.col]];if(c.filter)rows=rows.filter(c.filter);rows.sort(S.sort||(()=>0));const q=(searchQ[key]||"").toLowerCase();if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));return rows}
function tbody(key){const c=CTX[key],rows=rowsFor(key);
  if(!rows.length)return `<div class="empty">${searchQ[key]?"No matches. Try a different search.":"Nothing recorded yet. Use “Add "+esc(c.title)+"” to create the first entry."}</div>`;
  return `<table><thead><tr>${c.cols.map(x=>`<th>${esc(x.label)}</th>`).join("")}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${c.cols.map(x=>`<td>${x.f?x.f(r):dash(r[x.k])}</td>`).join("")}<td class="act"><button class="icon-btn" data-edit="${c.col}" data-id="${r.id}" aria-label="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button> <button class="icon-btn" data-del="${c.col}" data-id="${r.id}" aria-label="Delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></td></tr>`).join("")}</tbody></table>`}
function head(t,sub,btn){return `<div class="head"><div><h2 class="title acc">${t}</h2><p class="sub">${sub}</p></div>${btn||""}</div>`}
function stat(k,v,d,c,go){return `<div class="card stat" ${c?`style="--c:${c}"`:""} ${go?`data-goto="${go}" tabindex="0" role="button"`:""}><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d||"&nbsp;"}</div></div>`}

/* ---------- charts ---------- */
function lineChart(labels,series,o){o=o||{};const W=680,H=250,pl=40,pr=14,pt=14,pb=30;
  const vals=series.flatMap(s=>s.values).filter(v=>v!=null);if(!vals.length||!labels.length)return `<div class="empty">Readings will be charted here once recorded.</div>`;
  let mn=o.min!=null?o.min:Math.min(...vals),mx=o.max!=null?o.max:Math.max(...vals);if(o.min==null){const pad=Math.max(1,(mx-mn)*.2);mn=Math.floor(mn-pad);mx=Math.ceil(mx+pad)}if(mx===mn)mx=mn+1;
  const x=i=>pl+(labels.length>1?i*(W-pl-pr)/(labels.length-1):(W-pl-pr)/2),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"Chart")}">`;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,yy=y(v);s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="ax" x="${pl-6}" y="${yy+4}" text-anchor="end">${Math.round(v*10)/10}${o.unit||""}</text>`}
  if(o.limit!=null&&o.limit<mx&&o.limit>mn)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(o.limit)}" y2="${y(o.limit)}" style="stroke:var(--bad)" stroke-dasharray="5 4"/><text class="ax" x="${W-pr}" y="${y(o.limit)-5}" text-anchor="end" style="fill:var(--bad)">${esc(o.limitLabel||"limit")} ${o.limit}${o.unit||""}</text>`;
  const step=Math.ceil(labels.length/10);labels.forEach((l,i)=>{if(i%step===0)s+=`<text class="ax" x="${x(i)}" y="${H-9}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach(se=>{const pts=se.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;
    if(series.length===1)s+=`<path d="M${pts.map(p=>p.join(",")).join("L")}L${pts[pts.length-1][0]},${H-pb}L${pts[0][0]},${H-pb}Z" style="fill:${se.color};opacity:.12"/>`;
    s+=`<path d="M${pts.map(p=>p.join(",")).join("L")}" fill="none" style="stroke:${se.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" style="fill:${se.color};stroke:var(--card)" stroke-width="1.5"><title>${esc(se.name)}</title></circle>`)});
  return `<div class="chart">${s}</svg></div><div class="legend">${series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join("")}</div>`}

function fuelStats(){
  /* Delivery fills the 40-barrel big tank. 1st transfer: 20 go to the small tank, 20 stay in reserve.
     2nd transfer: last 20 go over, big tank is empty, fuel is ordered while the small tank runs. */
  const cyc=[...data.fuel].filter(c=>c.received).sort((a,b)=>a.received.localeCompare(b.received));
  const spans=[];cyc.forEach((c,i)=>{const prev=cyc[i-1],S1=parseD(c.small1),S2=parseD(c.small2),start=prev&&prev.small2?parseD(prev.small2):null;if(S1&&start)spans.push(diff(start,S1));if(S1&&S2)spans.push(diff(S1,S2))});
  const recent=spans.slice(-8),avg20=recent.length?recent.reduce((a,b)=>a+b,0)/recent.length:14;
  const done=cyc.filter(c=>c.small2).map(c=>({c,days:diff(parseD(c.received),parseD(c.small2))}));
  const avgCycle=done.length?done.slice(-6).reduce((a,b)=>a+b.days,0)/Math.min(6,done.length):avg20*2;
  const cur=cyc[cyc.length-1]||null,prev=cyc[cyc.length-2]||null,t=today();
  const st={cur,avg20,avgCycle,perDay:BIG/avgCycle,big:0,small:0,phase:"none",orderDate:null,transferDate:null,runOut:null,cyc,done};
  st.pendingOrder=data.fuel.find(c=>c.order&&!c.received)||null;
  if(!cur)return st;
  const R=parseD(cur.received),S1=parseD(cur.small1),S2=parseD(cur.small2),lvl=from=>Math.max(0,SMALL-SMALL*Math.max(0,diff(from,t))/avg20);
  if(!S1){const from=prev&&prev.small2?parseD(prev.small2):R;st.phase="full";st.big=BIG;st.small=lvl(from);st.transferDate=addDays(from,Math.round(avg20));st.orderDate=addDays(from,Math.round(avg20*2));st.runOut=addDays(from,Math.round(avg20*3))}
  else if(!S2){st.phase="reserve";st.big=BIG-SMALL;st.small=lvl(S1);st.orderDate=addDays(S1,Math.round(avg20));st.transferDate=st.orderDate;st.runOut=addDays(S1,Math.round(avg20*2))}
  else{st.phase="empty";st.big=0;st.small=lvl(S2);st.orderDate=S2;st.runOut=addDays(S2,Math.round(avg20))}
  st.daysToOrder=diff(t,st.orderDate);st.daysToRunOut=diff(t,st.runOut);return st;
}

function cycleChart(st){
  const rows=st.done.slice(-10);if(!rows.length)return `<div class="empty">Finished fuel cycles will appear here.</div>`;
  const W=Math.max(560,rows.length*64),H=220,pl=34,pb=38,pt=18,max=Math.max(35,...rows.map(r=>r.days)),bw=(W-pl-10)/rows.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Days each 40-barrel delivery lasted">`;
  [0,10,20,30].forEach(v=>{const y=H-pb-(H-pb-pt)*v/max;s+=`<line class="gl" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+4}" text-anchor="end">${v}</text>`});
  const avgY=H-pb-(H-pb-pt)*st.avgCycle/max;
  rows.forEach((r,i)=>{const h=(H-pb-pt)*r.days/max,x=pl+i*bw+bw*.18,y=H-pb-h,bwi=bw*.64;
    s+=`<rect x="${x}" y="${y}" width="${bwi}" height="${h}" rx="6" fill="${r.days<st.avgCycle-2?"#F59E0B":"#D97706"}"><title>${fd(r.c.received)} to ${fd(r.c.small2)}: ${r.days} days</title></rect>
    <text x="${x+bwi/2}" y="${y-5}" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">${r.days}</text><text class="ax" x="${x+bwi/2}" y="${H-pb+16}" text-anchor="middle">${fds(r.c.received)}</text>`});
  return `<div class="chart">${s}<line x1="${pl}" x2="${W}" y1="${avgY}" y2="${avgY}" style="stroke:var(--ink)" stroke-dasharray="5 4" stroke-width="1.5"/></svg></div>`;
}

   <ul>${on.length?on.map(p=>`<li>${av(p.name,dept)}<span><b style="display:block;font-weight:600;line-height:1.2">${esc(p.name)}</b><small style="opacity:.7">${esc(p.role||"")}</small></span></li>`).join(""):`<li style="opacity:.75;font-size:13px">No one assigned to shift ${s?esc(s.k):""} yet. Set each person's shift in Reporting line &amp; staff.</li>`}</ul></div>`}

   <div class="herostats"><button class="hs" data-goto="fuel"><b>${st.perDay.toFixed(2)}</b><span>barrels a day</span></button><button class="hs" data-goto="filters"><b>${(filterDue().filter(f=>f.next).sort((a,b)=>a.next-b.next)[0]||{}).next?fds(filterDue().filter(f=>f.next).sort((a,b)=>a.next-b.next)[0].next):"—"}</b><span>next filter change</span></button>

function slideSEC(){const gi=gateInside(),cams=data.cameras,ca=cams.filter(c=>c.status==="Active").length;

/* ---------- carousel ---------- */
let car={i:0,timer:null,paused:false};
function carouselHTML(al){const slides=[slideCLS(al),slideNOC(),slideGEN(),slideSEC()],names=["CLS station","NOC","Generator","Security"];
  return `<div class="carousel" id="car" aria-roledescription="carousel" aria-label="Department highlights"><div class="cprog" id="cprog"></div><div class="slides" id="slides" style="transform:translateX(-${car.i*100}%)">${slides.map((s,i)=>`<div class="slide" role="group" aria-roledescription="slide" aria-label="${names[i]}" ${i!==car.i?'aria-hidden="true"':""}>${s}</div>`).join("")}</div>
   <div class="cnav"><button class="carr" data-car="-1" aria-label="Previous slide">‹</button>${names.map((n,i)=>`<button class="cdot" data-cdot="${i}" aria-label="Show ${n}" aria-current="${i===car.i}"></button>`).join("")}<button class="carr" data-car="1" aria-label="Next slide">›</button></div></div>`}
function carGo(i){const el=$("slides");if(!el)return;car.i=(i+4)%4;el.style.transform=`translateX(-${car.i*100}%)`;
  el.querySelectorAll(".slide").forEach((s,k)=>s.toggleAttribute("aria-hidden",k!==car.i));document.querySelectorAll(".cdot").forEach((d,k)=>d.setAttribute("aria-current",String(k===car.i)));carStart()}
const reduced=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function carStart(){clearTimeout(car.timer);const p=$("cprog");if(!p||reduced()||car.paused){if(p)p.classList.remove("run");return}p.classList.remove("run");void p.offsetWidth;p.classList.add("run");car.timer=setTimeout(()=>carGo(car.i+1),8000)}
function carBind(){const c=$("car");if(!c)return;c.addEventListener("mouseenter",()=>{car.paused=true;carStart()});c.addEventListener("mouseleave",()=>{car.paused=false;carStart()});
  c.addEventListener("focusin",()=>{car.paused=true;carStart()});c.addEventListener("focusout",()=>{car.paused=false;carStart()});
  let x0=null;c.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});c.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)carGo(car.i+(dx<0?1:-1));x0=null});carStart()}

 schedule(){const m=nowMin();

 org(){const P=people(),find=n=>P.find(p=>p.name===n),lead=P.filter(p=>p.dept==="Leadership");
  const chain=[];let top=lead.find(p=>!p.reportsTo||!find(p.reportsTo))||lead[0];const seen=new Set();while(top&&!seen.has(top.name)){seen.add(top.name);chain.push(top);top=P.find(p=>p.reportsTo===top.name&&(p.dept==="Leadership"||p.dept==="Management"))}

 noc(){const lt=latestTraffic(),links=linkRows(lt),al=alerts().filter(x=>x.dept==="NOC"),a=avg(links.map(x=>x.p));

 security(){const al=alerts().filter(x=>x.dept==="Security"),td=todayIso(),gt=data.gateLog.filter(g=>g.date===td);
  return slideSEC().replace('class="hero h-sec"','class="hero h-sec" style="margin-bottom:14px"')+
  `<div class="grid g2"><div class="card"><h3>Security needs attention</h3>${al.length?`<div class="alerts">${al.map(x=>`<button class="alert" style="--c:${x.c}" data-goto="${x.go}"><span><b>${esc(x.t)}</b><small>${esc(x.d)}</small></span><i>Open</i></button>`).join("")}</div>`:`<div class="empty">Nothing needs attention right now.</div>`}</div>
   <div class="card"><h3>Gate log today <span class="hint">· ${fd(td)}</span></h3>${gt.length?gt.map(g=>`<div class="kv"><span><b>${esc(g.name)}</b><div class="hint">${esc(g.gate)} · ${esc(g.tin||"—")} / ${esc(g.tout||"—")}</div></span>${sp(g.status)}</div>`).join(""):`<div class="empty">No gate entries recorded today.</div>`}<div style="margin-top:10px"><button class="btn sm" data-addc="gateLog">+ Log gate entry</button></div></div></div>
  <h3>Security team</h3><div class="grid g4">${byDept("Security").map(p=>{const tk=data.tasks.filter(t=>t.assignee===p.name&&t.status!=="Done").length,c=data.clearances.find(x=>x.holder===p.name);
   return `<div class="card stat" style="--c:var(--sec)"><div style="display:flex;gap:10px;align-items:center">${av(p.name,"Security",36)}<span style="min-width:0"><b style="display:block;line-height:1.2">${esc(p.name)}</b><span class="k">${esc(p.role||"")}</span></span></div>
    <div class="kv" style="margin-top:8px"><span class="hint">Shift</span><b class="mono">${dash(p.shift)}</b></div><div class="kv"><span class="hint">Open tasks</span><b>${tk}</b></div><div class="kv"><span class="hint">Airport pass</span>${c?clrPill(c):pill("Not recorded","neutral")}</div></div>`}).join("")}</div>
  <h3>Shift reports</h3>${table("secReports","secReports")}`},
 gatelog(){const G=data.gateLog,by=s=>G.filter(g=>g.status===s).length;
  return head("Visitor gate log","Every visitor, contractor and vehicle cleared through the airport gates and the DARE1 site gate. Approve, check in and check out from the Status column.")+
  `<div class="grid g4">${stat("Waiting for clearance",by("Requested"),"requested","var(--info)")}${stat("On site now",by("Inside"),"checked in, not out","var(--warn)")}${stat("Entries today",G.filter(g=>g.date===todayIso()).length,fd(today()),"var(--ok)")}${stat("Denied",by("Denied"),"all time","var(--bad)")}</div>
  <h3>Gate log</h3>${table("gateLog","gateLog")}`},
 clearance(){const C=data.clearances.map(r=>({r,...clr(r)})),v=C.filter(x=>x.days!=null&&x.days>14).length,soon=C.filter(x=>x.days!=null&&x.days>=0&&x.days<=14).length,ex=C.filter(x=>x.days!=null&&x.days<0).length,nd=C.filter(x=>x.days==null).length;
  return head("Airport compound gate clearance","Access clearance for all CLS staff and the two vehicles at the Mogadishu Airport compound gate. Each clearance lasts three months and is renewed at the AMISOM office.")+
  `<div class="grid g4">${stat("Valid",v,"more than 14 days left","var(--ok)")}${stat("Renew now",soon,"14 days or less","var(--warn)")}${stat("Expired",ex,"","var(--bad)")}${stat("No date recorded",nd,"add the issue date","var(--muted)")}</div>
  <h3>Staff clearance</h3>${table("clr-staff","clearances",{preset:{type:"Staff"},filter:r=>r.type!=="Vehicle"})}<h3>Vehicles</h3>${table("clr-veh","clearances",{preset:{type:"Vehicle"},filter:r=>r.type==="Vehicle",title:"vehicle clearance"})}`},
 tasks(){const T=data.tasks,f=taskDept;const rows=f==="All"?null:r=>deptOf(r.assignee)===f;
  const perf=crew().filter(p=>f==="All"||p.dept===f).map(p=>{const mine=T.filter(t=>t.assignee===p.name),done=mine.filter(t=>t.status==="Done"),rated=done.filter(t=>t.rating);return {p,open:mine.length-done.length,done:done.length,od:mine.filter(t=>t.status!=="Done"&&t.due&&parseD(t.due)<today()).length,avg:rated.length?rated.reduce((a,t)=>a+ +t.rating,0)/rated.length:null}}).filter(x=>x.open+x.done>0||f!=="All");
  return head("Staff tasks","Assign work to anyone at the CLS, follow it up and rate how it was done. Filter by department.")+
  `<div class="tools"><div class="seg" role="group" aria-label="Department">${["All","NOC","Generator","Security","Support"].map(d=>`<button type="button" data-tdept="${d}" aria-pressed="${f===d}">${d}</button>`).join("")}</div></div>
  <div class="grid g4">${stat("Open",T.filter(t=>t.status!=="Done"&&(!rows||rows(t))).length,"to do or in progress")}${stat("Overdue",T.filter(t=>t.status!=="Done"&&t.due&&parseD(t.due)<today()&&(!rows||rows(t))).length,"","var(--bad)")}${stat("Done",T.filter(t=>t.status==="Done"&&(!rows||rows(t))).length,"","var(--ok)")}</div>
  <h3>Tasks</h3>${table("tasks-"+f,"tasks",{filter:rows||undefined})}
  <h3>Workload</h3><div class="tablewrap"><table style="min-width:480px"><thead><tr><th>Name</th><th>Department</th><th>Open</th><th>Done</th><th>Overdue</th><th>Rating</th></tr></thead><tbody>${perf.map(x=>`<tr><td><b>${esc(x.p.name)}</b></td><td>${deptCell(x.p.name)}</td><td>${x.open}</td><td>${x.done}</td><td>${x.od?pill(String(x.od),"bad"):"0"}</td><td>${x.avg==null?"—":`<span class="stars">★</span> ${x.avg.toFixed(1)}`}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No tasks assigned yet.</td></tr>`}</tbody></table></div>`},
 painting(){const pd=paintDue(),cur=pd.open||[...data.painting].sort(SCHEMAS.painting.sort)[0];
  return head("Anti-corrosion painting","Rust treatment and painting of the generators, tanks, gates, building steel and AC units. Done twice a year.")+
  `<div class="grid g2"><div class="card"><h3>${cur?esc(cur.round):"No round yet"}</h3>${cur?`<div class="progress"><i style="width:${Math.round((cur.areas||[]).length/AREAS.length*100)}%"></i></div>
   <div class="chips" style="margin-top:12px">${AREAS.map(a=>`<button class="chip ${(cur.areas||[]).includes(a)?"on":""}" data-area="${esc(a)}" data-id="${cur.id}">${(cur.areas||[]).includes(a)?"✓ ":""}${esc(a)}</button>`).join("")}</div><p class="hint">Tap an area to mark it painted.</p>`:`<button class="btn" data-addc="painting">+ Start painting round</button>`}</div>
   <div class="card"><h3>Schedule</h3><div class="kv"><b>Last completed round</b><span>${pd.last?fd(pd.last):"—"}</span></div><div class="kv"><b>Next round due</b><span>${pd.next?pill(fd(pd.next),dueTone(diff(today(),pd.next)-14)):pill("Not scheduled","neutral")}</span></div><div class="kv"><b>Rounds recorded</b><span>${data.painting.length}</span></div></div></div>
  <h3>Painting rounds</h3>${table("painting","painting")}`},
 uniforms(){const yr=String(today().getFullYear()),got=new Set(data.uniforms.filter(u=>String(u.orderDate||"").startsWith(yr)).map(u=>u.staff));
  return head("Uniforms","Uniform and safety kit for every CLS team, ordered once a year per person.")+
  `<div class="grid g4">${["NOC","Generator","Security","Support"].map(d=>{const ppl=byDept(d),n=ppl.filter(p=>got.has(p.name)).length;return `<div class="card stat" style="--c:${DHEX[d]}"><div class="k">${d==="Support"?"Support staff":d+" team"}</div><div class="v">${n} / ${ppl.length}</div><div class="d">ordered in ${yr}</div><div class="progress" style="margin-top:8px;--c:${DHEX[d]}"><i style="width:${ppl.length?n/ppl.length*100:0}%"></i></div>
   <div class="chips" style="margin-top:10px">${ppl.map(p=>`<span class="pill ${got.has(p.name)?"ok":"neutral"}" title="${esc(p.name)}">${esc(p.name.split(" ")[0])}</span>`).join("")}</div></div>`}).join("")}</div>
  <h3>Uniform orders</h3>${table("uniforms","uniforms")}`},
 spares(){return invView("Spare","Spare inventory","Spare cards, modules and SFPs for the Ciena, Tejas, Huawei and Cisco equipment, and spare parts for the three generators.").replace('<h3>Inventory record</h3>',`<h3>Generator spares <span class="hint">· use + and − as items go in and out</span></h3>${table("genSpares","genSpares")}<h3>Datacenter spares record</h3>`)},
 store(){return invView("Store","Office block store","General items in the office block store: fire extinguishers, tools, paint, electrical and generator materials.")}
});
let envSel="PR:temp",taskDept="All";

/* ---------- render ---------- */
let active="overview",lastActive=null;
function renderNav(){let g="",h="";SECTIONS.forEach(s=>{if(s.group!==g){g=s.group;h+=`<div class="grp" style="--gc:${GROUPS[g]}"><i></i>${g==="Shared"?"Shared by all teams":g}</div>`}const n=badge(s.id);
  h+=`<button class="nv" style="--c:${s.color}" data-goto="${s.id}" ${s.id===active?'aria-current="page"':""}><span class="ic">${ic(s.icon)}</span><span class="t">${esc(s.label)}</span>${n?`<span class="n">${n}</span>`:""}</button>`});$("sidenav").innerHTML=h}
function countUp(){if(reduced())return;document.querySelectorAll("#view .stat .v, #view .hs b").forEach(el=>{if(el.children.length)return;const t=el.textContent.trim();if(!/^\d{1,4}$/.test(t))return;const end=+t;if(end<2)return;const t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/700);el.textContent=Math.round(end*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function render(quiet){dirty=false;const s=SEC[active];document.documentElement.style.setProperty("--accent",s.color);
  const f=document.activeElement,fid=f&&f.dataset&&f.dataset.search?f.id:null,pos=fid?f.selectionStart:0;
  renderNav();$("crumbGrp").textContent=s.group==="Shared"?"Shared by all teams":s.group;$("crumbTtl").textContent=s.label;
  Object.keys(CTX).forEach(k=>delete CTX[k]);const v=$("view");v.innerHTML=VIEWS[active]();
  if(lastActive!==active){v.style.animation="none";void v.offsetWidth;v.style.animation="";countUp()}lastActive=active;
  Object.keys(CTX).forEach(k=>{const c=$("cnt-"+k);if(c)c.textContent=rowsFor(k).length+" records"});
  if(active==="overview")carBind();else clearTimeout(car.timer);
  tick();if(fid&&$(fid)){$(fid).focus();try{$(fid).setSelectionRange(pos,pos)}catch(e){}}}
function tick(){const p=nowParts(),t=hhmm();$("chipClock").innerHTML=`<b>${WD[today().getDay()]} ${fds(today())} · ${t}</b> EAT`;
  const s=["NOC","Generator","Security"].map(d=>(curShift(d)||{}).k||"—");$("chipShift").innerHTML=`Shifts now <b>NOC ${esc(s[0])} · Gen ${esc(s[1])} · Sec ${esc(s[2])}</b>`;
  document.querySelectorAll(".clk").forEach(e=>e.textContent=t+" EAT")}
let lastMin=nowMin();setInterval(()=>{tick();const m=nowMin();if(m!==lastMin){lastMin=m;if($("backdrop").hidden&&(active==="schedule"||(m%30===0)))render(true)}},15000);
function go(id){if(!SEC[id])return;active=id;closeSide();render();window.scrollTo({top:0});try{history.replaceState(null,"","#"+id)}catch(e){}}
function closeSide(){$("side").classList.remove("open");$("scrim").hidden=true}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- modal ---------- */
let formCtx=null;
function closeModal(){$("backdrop").hidden=true;formCtx=null;if(dirty)render(true)}
function openForm(col,rec,preset){const S=SCHEMAS[col],fields=S.fields,isNew=!rec;rec=rec||{};formCtx={col,id:rec.id,preset:preset||{},fields,rec};
  const val=f=>{let v=rec[f.k];if(v==null&&isNew){v=(preset&&preset[f.k]!=null)?preset[f.k]:typeof f.def==="function"?f.def():f.def}return v==null?"":v};
  $("modal").innerHTML=`<header><h4>${isNew?"Add":"Edit"} ${esc(S.title)}</h4><button class="icon-btn" data-close aria-label="Close">✕</button></header><form id="recForm" novalidate><div class="body"><div class="form">${fields.map(f=>{const v=val(f),id="f-"+f.k,lab=`${esc(f.label)}${f.req?" *":""}`,hint=f.hint?`<span class="hint">${esc(f.hint)}</span>`:"";let inp;
    if(f.type==="multi"){const sel=Array.isArray(v)?v:[];return `<div class="lbl full" data-multi="${f.k}">${lab}<div class="chips">${f.options.map(o=>`<button type="button" class="chip ${sel.includes(o)?"on":""}" data-chip="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join("")}</div>${hint}</div>`}
    if(f.type==="select"){let o=typeof f.options==="function"?f.options():f.options;o=[...o];if(v!==""&&!o.includes(String(v)))o.push(String(v));if(!o.includes(""))o.unshift("");inp=`<select id="${id}" name="${f.k}">${o.map(x=>`<option ${String(x)===String(v)?"selected":""}>${esc(x)}</option>`).join("")}</select>`}
    else if(f.type==="textarea")inp=`<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`;
    else inp=`<input id="${id}" name="${f.k}" type="${f.type||"text"}" ${f.type==="number"?'step="any" inputmode="decimal"':""} value="${esc(v)}">`;
    return `<label class="${f.full||f.type==="textarea"?"full":""}" for="${id}">${lab}${inp}${hint}</label>`}).join("")}</div><p class="hint" id="formErr" style="color:var(--bad);margin:10px 0 0" hidden></p></div>
   <footer><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save</button></footer></form>`;
  $("backdrop").hidden=false;const first=$("modal").querySelector("input,select,textarea");if(first)first.focus()}
function confirmDel(col,id){formCtx={del:{col,id}};$("modal").innerHTML=`<header><h4>Delete this record?</h4><button class="icon-btn" data-close aria-label="Close">✕</button></header><div class="body"><p style="margin:4px 0">This removes the ${esc(SCHEMAS[col].title)} for everyone who uses this dashboard. It cannot be undone.</p></div><footer><button class="btn ghost" data-close>Keep it</button><button class="btn danger" id="doDel">Delete</button></footer>`;$("backdrop").hidden=false;$("doDel").focus()}
async function submitForm(){const {col,id,preset,fields,rec}=formCtx;const out={...rec,...preset};delete out.id;
  for(const f of fields){if(f.type==="multi"){out[f.k]=[...$("modal").querySelectorAll(`[data-multi="${f.k}"] .chip.on`)].map(c=>c.dataset.chip);continue}
    const el=$("f-"+f.k);if(!el)continue;let v=el.value.trim();if(f.req&&v===""){const e=$("formErr");e.textContent="Fill in “"+f.label+"” to save.";e.hidden=false;el.focus();return}
    if(f.type==="number"){v=v===""?null:num(v)}if(v===""||v==null)delete out[f.k];else out[f.k]=v}
  if(col==="cienaPorts"){const dup=data.cienaPorts.find(p=>String(p.slot)===String(out.slot)&&+p.port===+out.port&&p.id!==id);if(dup){const e=$("formErr");e.textContent="Port 6-"+out.slot+"-"+out.port+" is already recorded. Edit that port instead.";e.hidden=false;return}}
  if(col==="tasks"&&out.status==="Done"&&!out.completed)out.completed=todayIso();
  if(col==="problems"&&out.status==="Fixed"&&!out.fixedDate)out.fixedDate=todayIso();
  if(col==="painting"&&(out.areas||[]).length===AREAS.length&&!out.completedDate)out.completedDate=todayIso();
  const ok=await saveRec(col,{id,...out});if(ok){closeModal();toast("Saved")}}
function csv(key){const c=CTX[key],S=SCHEMAS[c.col],F=S.fields,rows=rowsFor(key);const q=v=>'"'+String(v==null?"":Array.isArray(v)?v.join("; "):v).replace(/"/g,'""')+'"';
  const txt=[F.map(f=>q(f.label)).join(","),...rows.map(r=>F.map(f=>q(r[f.k])).join(","))].join("\r\n");
  downloads.save({filename:"cls-"+key+"-"+todayIso()+".csv",data:"﻿"+txt}).then(()=>toast("Exported")).catch(e=>{if(e&&e.code!=="declined")toast("Could not export this table here.")})}

/* ---------- theme ---------- */
const TK="cls-hub-theme";
function applyTheme(t){const r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");document.querySelectorAll(".theme button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===t)))}
let theme=null;try{theme=localStorage.getItem(TK)}catch(e){}
if(theme)applyTheme(theme);else{const cur=document.documentElement.getAttribute("data-theme")||"system";document.querySelectorAll(".theme button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===cur)))}
document.querySelector(".theme").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;theme=b.dataset.t;applyTheme(theme);try{localStorage.setItem(TK,theme)}catch(e){}});

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const chip=e.target.closest("#modal .chip[data-chip]");if(chip){chip.classList.toggle("on");chip.setAttribute("aria-pressed",String(chip.classList.contains("on")));return}
  const t=e.target.closest("[data-goto],[data-add],[data-addc],[data-addp],[data-edit],[data-del],[data-csv],[data-close],[data-car],[data-cdot],[data-env],[data-tdept],[data-qty],[data-area],[data-quick],[data-gs],#burger,#scrim,#doDel");
  if(!t){if(e.target===$("backdrop"))closeModal();return}
  if(t.id==="burger"){$("side").classList.add("open");$("scrim").hidden=false}
  else if(t.id==="scrim")closeSide();
  else if(t.id==="doDel"){const d=formCtx.del;closeModal();delRec(d.col,d.id).then(()=>toast("Deleted"))}
  else if(t.dataset.close!==undefined)closeModal();
  else if(t.dataset.car)carGo(car.i+ +t.dataset.car);
  else if(t.dataset.cdot)carGo(+t.dataset.cdot);
  else if(t.dataset.env){envSel=t.dataset.env;render()}
  else if(t.dataset.tdept){taskDept=t.dataset.tdept;render()}
  else if(t.dataset.goto){if(t.dataset.scroll&&active===t.dataset.goto){const el=$(t.dataset.scroll);if(el)el.scrollIntoView({behavior:reduced()?"auto":"smooth"})}else go(t.dataset.goto)}
  else if(t.dataset.add){const c=CTX[t.dataset.add];openForm(c.col,null,c.preset)}
  else if(t.dataset.addc)openForm(t.dataset.addc,null,{});
  else if(t.dataset.addp){const [slot,port]=t.dataset.addp.split(":");openForm("cienaPorts",null,{slot,port:+port})}
  else if(t.dataset.edit){const r=data[t.dataset.edit].find(x=>x.id===t.dataset.id);if(r)openForm(t.dataset.edit,r,{})}
  else if(t.dataset.del)confirmDel(t.dataset.del,t.dataset.id);
  else if(t.dataset.csv)csv(t.dataset.csv);
  else if(t.dataset.qty){const r=data.genSpares.find(x=>x.id===t.dataset.id);if(!r)return;t.disabled=true;await saveRec("genSpares",{...r,qty:Math.max(0,(+r.qty||0)+Number(t.dataset.qty))})}
  else if(t.dataset.area){const r=data.painting.find(x=>x.id===t.dataset.id);if(!r)return;const a=new Set(r.areas||[]);a.has(t.dataset.area)?a.delete(t.dataset.area):a.add(t.dataset.area);
    const nr={...r,areas:AREAS.filter(x=>a.has(x))};if(nr.areas.length===AREAS.length&&!nr.completedDate)nr.completedDate=todayIso();t.disabled=true;await saveRec("painting",nr)}
  else if(t.dataset.quick){const st=fuelStats();if(!st.cur)return;t.disabled=true;if(await saveRec("fuel",{...st.cur,[t.dataset.quick]:todayIso()}))toast("Recorded for today")}
  else if(t.dataset.gs){const [id,s]=t.dataset.gs.split(":"),r=data.gateLog.find(x=>x.id===id);if(!r)return;const n={...r,status:s};if(s==="Inside"&&!n.tin)n.tin=hhmm();if(s==="Exited"&&!n.tout)n.tout=hhmm();t.disabled=true;if(await saveRec("gateLog",n))toast(s==="Approved"?"Clearance approved":s==="Inside"?"Checked in at "+n.tin:"Checked out at "+n.tout)}
});
document.addEventListener("submit",e=>{if(e.target.id==="recForm"){e.preventDefault();submitForm()}});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.search;if(!k)return;searchQ[k]=e.target.value;$("tbl-"+k).innerHTML=tbody(k);const c=$("cnt-"+k);if(c)c.textContent=rowsFor(k).length+" records"});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("backdrop").hidden)closeModal();else closeSide()}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".stat[data-goto]")){e.preventDefault();go(e.target.dataset.goto)}
  if(active==="overview"&&$("backdrop").hidden&&(e.key==="ArrowRight"||e.key==="ArrowLeft")&&e.target.closest&&e.target.closest("#car"))carGo(car.i+(e.key==="ArrowRight"?1:-1))});
const h0=(location.hash||"").slice(1);if(SEC[h0])active=h0;
initStore();
})();
</script>
