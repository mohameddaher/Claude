<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>CLS Generator Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
      </div>
      <div>
        <h1>CLS Generator Operations</h1>
        <p>Mogadishu CLS datacenter, DARE1</p>
      </div>
    </div>
    <span class="today" id="todayLbl"></span>
    <span class="sync"><span class="dot" id="syncDot"></span><span id="syncLbl">Loading…</span></span>
    <button class="btn ghost sm" id="backupBtn" type="button">Back up data</button>
    <button class="btn ghost sm" id="restoreBtn" type="button">Restore backup</button>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main>
  <div class="band"></div>
  <div id="view"></div>
</main>
<div class="backdrop" id="backdrop"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
