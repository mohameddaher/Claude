<title>CLS Security Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky brand bar + pill tabs, dark command-desk hero, card dashboard below. Sibling of CLS Generator Operations. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#13202B; --muted:#5A6B78; --line:#DCE3E8; --soft:#EBF0F3; --field:#FFFFFF; --fieldline:#CBD5DC;
  --hero:#0D2433; --hero-2:#123447; --hero-ink:#EAF3F8; --hero-muted:#9DB5C3; --hero-line:rgba(157,181,195,.22);
  --overview:#0B6C8C; --uniform:#55741A; --gate:#B9600B; --staff:#5546BE;
  --ok-bg:#E5F5EA; --ok:#157038; --warn-bg:#FFF1DC; --warn:#A44F06; --bad-bg:#FCE8E8; --bad:#B42121; --info-bg:#E4F0FB; --info:#1D57A8;
  --shadow:0 18px 40px -24px rgba(13,36,51,.45);
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --accent:var(--overview);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B141B; --surface:#111D26; --ink:#E3ECF2; --muted:#93A6B3; --line:#223441; --soft:#172632; --field:#0E1A22; --fieldline:#2C4252;
  --hero:#07121A; --hero-2:#0D1F2B; --hero-ink:#EAF3F8; --hero-muted:#8FA8B8; --hero-line:rgba(143,168,184,.18);
  --overview:#39A9CF; --uniform:#9CC24E; --gate:#F0973D; --staff:#9C90F6;
  --ok-bg:#12301E; --ok:#6FD58F; --warn-bg:#382410; --warn:#F5B160; --bad-bg:#3A1616; --bad:#F48A8A; --info-bg:#132B44; --info:#86B9F2;
  --shadow:0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B141B; --surface:#111D26; --ink:#E3ECF2; --muted:#93A6B3; --line:#223441; --soft:#172632; --field:#0E1A22; --fieldline:#2C4252;
  --hero:#07121A; --hero-2:#0D1F2B; --hero-ink:#EAF3F8; --hero-muted:#8FA8B8; --hero-line:rgba(143,168,184,.18);
  --overview:#39A9CF; --uniform:#9CC24E; --gate:#F0973D; --staff:#9C90F6;
  --ok-bg:#12301E; --ok:#6FD58F; --warn-bg:#382410; --warn:#F5B160; --bad-bg:#3A1616; --bad:#F48A8A; --info-bg:#132B44; --info:#86B9F2;
  --shadow:0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:-.01em}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:var(--surface);transition:background .3s;flex:none}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand p{margin:0;color:var(--muted);font-size:13px}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--soft)}
.theme button{border:0;background:transparent;border-radius:999px;width:32px;height:28px;display:grid;place-items:center;color:var(--muted)}
.theme button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
nav.tabs{max-width:1280px;margin:0 auto;padding:10px 20px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.tab{--c:var(--overview);border:1.5px solid color-mix(in srgb,var(--c) 32%,var(--surface));background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);
  padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.tab[aria-selected="true"]{background:var(--c);color:var(--surface);border-color:var(--c)}
.tab .n{background:var(--surface);color:var(--c);border-radius:999px;font-size:11.5px;padding:0 7px;font-weight:700;line-height:18px}

main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(135deg,var(--hero) 0%,var(--hero-2) 100%);color:var(--hero-ink);padding:30px 30px 26px;box-shadow:var(--shadow);margin-bottom:22px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}
.hero > *:not(canvas){position:relative}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero .eyebrow .live{display:inline-flex;align-items:center;gap:6px;color:#7EE2A8}
.hero .eyebrow .live i{width:8px;height:8px;border-radius:50%;background:#3DD27D;box-shadow:0 0 0 0 rgba(61,210,125,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(61,210,125,0)}100%{box-shadow:0 0 0 0 rgba(61,210,125,0)}}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,78px);line-height:.92;letter-spacing:.005em;text-transform:uppercase;margin:12px 0 10px;text-wrap:balance}
.hero h2 span{color:#F3B35A}
.hero p.lede{max-width:58ch;color:var(--hero-muted);margin:0 0 20px;font-size:16px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:end}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero{padding:24px 20px 20px}}
.duty{border:1px solid var(--hero-line);border-radius:16px;padding:14px 16px;background:rgba(255,255,255,.04)}
.duty .lbl{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted)}
.duty .shift{font-family:var(--display);font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.1;margin:2px 0 8px}
.duty ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.duty li{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;background:var(--c,var(--overview));color:#fff}
.hstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hstat{border:1px solid var(--hero-line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04);text-align:left;color:inherit;transition:background .2s}
button.hstat:hover{background:rgba(255,255,255,.09)}
.hstat .v{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
.hstat .k{font-size:13px;color:var(--hero-muted);margin-top:4px}

/* Common */
.band{height:4px;background:var(--accent);border-radius:4px;margin-bottom:20px;transition:background .3s}
h2.title{font-family:var(--display);font-size:38px;margin:0;font-weight:700;letter-spacing:.01em;text-transform:uppercase;color:var(--accent);line-height:1}
.sub{color:var(--muted);margin:6px 0 20px;max-width:72ch}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
h3{font-size:17px;margin:28px 0 12px;font-weight:650}
h3 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{margin-top:0}
.stat{border-top:4px solid var(--c,var(--accent))}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.stat .d{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)} .bad{background:var(--bad-bg);color:var(--bad)} .info{background:var(--info-bg);color:var(--info)} .neutral{background:var(--soft);color:var(--muted)}
.btn{border:0;background:var(--accent);color:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--bad);color:var(--surface)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);background:var(--soft)}
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px dashed color-mix(in srgb,var(--gate) 55%,var(--line));background:color-mix(in srgb,var(--gate) 7%,var(--surface));border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.notice span{flex:1;min-width:220px}

/* Tables */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search,.tools select{border:1px solid var(--fieldline);border-radius:10px;padding:8px 12px;background:var(--field)}
.search{flex:1;min-width:180px;max-width:340px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:680px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
td.act{white-space:nowrap;text-align:right;width:1%}
td .s{color:var(--muted);font-size:12.5px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}

/* Alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.alert:hover{background:var(--soft)}
.alert .ttl{font-weight:600}
.alert .ds{color:var(--muted);font-size:13px}
.alert .go{margin-left:auto;color:var(--c);font-weight:600;font-size:13px;white-space:nowrap}

/* People */
.member{display:flex;flex-direction:column;gap:10px}
.member .top{display:flex;gap:12px;align-items:center}
.member .av{width:44px;height:44px;font-size:15px}
.member b{display:block;font-weight:650;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.bar2{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--c,var(--accent));border-radius:8px}

/* Reporting line */
.org{display:flex;flex-direction:column;align-items:center;padding:6px 0}
.orgnode{border:1.5px solid color-mix(in srgb,var(--staff) 40%,var(--surface));background:color-mix(in srgb,var(--staff) 8%,var(--surface));border-radius:12px;padding:8px 14px;text-align:center;min-width:min(200px,100%)}
.orgnode b{display:block;font-weight:650}
.orgnode span{font-size:12.5px;color:var(--muted)}
.orgnode.esc{border-style:dashed}
.orgline{width:2px;height:20px;background:color-mix(in srgb,var(--staff) 40%,var(--surface))}
.orgrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;position:relative;padding-top:20px}
.orgrow::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:2px;background:color-mix(in srgb,var(--staff) 40%,var(--surface))}
.orgrow .orgnode{position:relative;min-width:0}
.orgrow .orgnode::before{content:"";position:absolute;top:-20px;left:50%;width:2px;height:20px;background:color-mix(in srgb,var(--staff) 40%,var(--surface))}
@media (max-width:700px){.orgrow{grid-template-columns:1fr 1fr}.orgrow::before{left:25%;right:25%}}
.side{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%}
.side .esc-wrap{display:flex;align-items:center;min-width:0}
.side .esc-wrap .orgnode{min-width:0;flex:1}
.side .dash{width:18px;flex:none;border-top:2px dashed color-mix(in srgb,var(--staff) 40%,var(--surface))}
@media (max-width:700px){.side{grid-template-columns:1fr;justify-items:center;gap:8px}.side .spacer{display:none}.side .dash{display:none}}

/* Roster */
.roster{display:grid;grid-template-columns:84px repeat(7,minmax(54px,1fr));min-width:480px}
.roster div{padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.roster .h{background:var(--soft);font-weight:600;color:var(--muted);font-size:12px}
.roster .h.today{color:var(--overview)}
.roster .nm{font-weight:600}
.sh{display:inline-block;border-radius:6px;padding:1px 7px;font-weight:600;font-size:12px}
.sh.D{background:var(--info-bg);color:var(--info)} .sh.N{background:color-mix(in srgb,var(--staff) 16%,var(--surface));color:var(--staff)} .sh.O{background:var(--soft);color:var(--muted)}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(5,12,18,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px}
.backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:620px;border-top:6px solid var(--accent);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal header{padding:18px 20px 4px;display:flex;justify-content:space-between;align-items:center}
.modal h4{margin:0;font-size:19px}
.modal .body{padding:10px 20px}
.modal footer{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal footer .left{margin-right:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--fieldline);border-radius:10px;padding:9px 11px;background:var(--field);font-weight:400;font-size:14.5px;width:100%;color:var(--ink)}
.form textarea{min-height:74px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.clock{display:none}.brand h1{font-size:16px}h2.title{font-size:30px}}
</style>

<header class="top">
  <div class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div>
        <h1>CLS Security Operations</h1>
        <p>Mogadishu CLS datacenter, DARE1</p>
      </div>
    </div>
    <span class="clock" id="clock"></span>
    <div class="theme" role="group" aria-label="Colour theme">
      <button type="button" data-t="light" aria-label="Light mode" title="Light mode"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-t="system" aria-label="Match device" title="Match device"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button type="button" data-t="dark" aria-label="Dark mode" title="Dark mode"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</header>
<main>
  <div id="view"></div>
</main>
<div class="backdrop" id="backdrop"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ---------- Constants ---------- */
const TZ="Africa/Mogadishu";
const MEMBERS=[
  {id:"m1",name:"Ahmed Geylab Barale",role:"Security Member",c:"#0B6C8C"},
  {id:"m2",name:"Ali Hussein Hassan",role:"Security Member",c:"#55741A"},
  {id:"m3",name:"Abdullahi Mohamud Ahmed",role:"Security Member",c:"#B9600B"},
  {id:"m4",name:"Jamac Mohamed Saeed",role:"Security Member",c:"#5546BE"}
];
/* Uniform items and how many months each lasts before replacement */
const ITEMS={"Shirt":6,"Trousers":6,"Boots":12,"Jacket":24,"Cap / Beret":12,"Belt":24,"Reflective vest":12,"ID badge":24,"Raincoat":24};
const CONDITION=["New","Good","Worn","Damaged","Lost"];
const SIZES=["S","M","L","XL","XXL","39","40","41","42","43","44","45","46","One size"];
const GATES=["Airport main gate (AAIA)","Airport cargo gate","DARE1 site gate","DARE1 server hall door"];
const GTYPES=["CLS staff","Visitor","Contractor","Vehicle","Delivery","Engineer (vendor)"];
const GSTATUS=["Requested","Approved","Denied","Inside","Exited"];
const PRIORITY=["High","Medium","Low"];
const TSTATUS=["Open","In progress","Done"];
const SHIFTS={D:"Day 06:00–18:00",N:"Night 18:00–06:00",O:"Off"};
const TASK_TEMPLATES=["Perimeter patrol, fence line and generator yard","Check CCTV cameras and recording","Verify access log against gate list","Inspect fire extinguishers and emergency exits","Escort vendor engineer to server hall","Hand-over briefing to next shift","Check airport passes for expiry","Test panic alarm and radios"];

/* ---------- Date helpers (Mogadishu time) ---------- */
const DAY=86400000, MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function nowParts(){try{const f=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date());const o={};f.forEach(p=>o[p.type]=p.value);return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour%24,mi:+o.minute,s:+o.second}}catch(e){const d=new Date();return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate(),h:d.getHours(),mi:d.getMinutes(),s:d.getSeconds()}}}
function parseD(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){const p=nowParts();return new Date(p.y,p.m-1,p.d)}
function todayIso(){return iso(today())}
function nowTime(){const p=nowParts();return String(p.h).padStart(2,"0")+":"+String(p.mi).padStart(2,"0")}
function diff(a,b){return Math.round((b-a)/DAY)}
function addDays(d,n){return new Date(d.getTime()+n*DAY)}
function addMonths(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r}
function fd(s){const d=typeof s==="string"?parseD(s):s;if(!d)return "—";return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()}
function rel(d){const n=diff(today(),d);if(n===0)return "today";if(n===1)return "tomorrow";if(n===-1)return "yesterday";return n>0?"in "+n+" days":Math.abs(n)+" days ago"}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function initials(n){const p=n.split(" ");return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase()}
function mem(id){return state.members.find(m=>m.id===id)}
function mname(id){const m=mem(id);return m?m.name:"—"}
function short(id){const m=mem(id);return m?m.name.split(" ").slice(0,2).join(" "):"—"}

/* ---------- Derived ---------- */
function shiftOf(memberId,date){
  const m=mem(memberId); if(!m)return "O";
  const anchor=parseD(state.settings.anchor)||today();
  const wk=Math.floor(diff(anchor,date)/7);
  const aDay=((wk%2)+2)%2===0; // team A on day in even weeks
  const onDay=(m.team==="A")===aDay;
  return onDay?"D":"N";
}
function currentShift(){const h=nowParts().h;return h>=6&&h<18?"D":"N"}
function onDutyNow(){
  const s=currentShift(); let date=today();
  if(s==="N"&&nowParts().h<6)date=addDays(date,-1);
  return state.members.filter(m=>shiftOf(m.id,date)===s);
}
function uniformDue(u){return addMonths(parseD(u.issued),ITEMS[u.item]||12)}
function uniformState(u){
  if(u.condition==="Lost"||u.condition==="Damaged")return {cls:"bad",txt:"Replace now"};
  const n=diff(today(),uniformDue(u));
  if(n<0)return {cls:"bad",txt:"Overdue "+Math.abs(n)+"d"};
  if(n<=30)return {cls:"warn",txt:"Due "+rel(uniformDue(u))};
  return {cls:"ok",txt:"In service"};
}
function passState(m){
  if(!m.passExpiry)return {cls:"neutral",txt:"Not recorded",n:null};
  const n=diff(today(),parseD(m.passExpiry));
  if(n<0)return {cls:"bad",txt:"Expired "+Math.abs(n)+"d ago",n};
  if(n<=30)return {cls:"warn",txt:"Expires "+rel(parseD(m.passExpiry)),n};
  return {cls:"ok",txt:"Valid to "+fd(m.passExpiry),n};
}
const GCLS={Requested:"info",Approved:"ok",Denied:"bad",Inside:"warn",Exited:"neutral"};
function taskState(t){
  if(t.status==="Done")return {cls:"ok",txt:"Done"};
  const n=diff(today(),parseD(t.due));
  if(n<0)return {cls:"bad",txt:"Overdue "+Math.abs(n)+"d"};
  if(t.status==="In progress")return {cls:"info",txt:"In progress"};
  return {cls:n===0?"warn":"neutral",txt:n===0?"Due today":"Open"};
}
const PCLS={High:"bad",Medium:"warn",Low:"neutral"};

  ${rows.length?rows.map(g=>`<tr><td>${fd(g.date)}</td><td><b>${esc(g.name)}</b><div class="s">${esc(g.company)}</div></td><td>${esc(g.type)}</td><td>${esc(g.gate)}</td><td>${esc(g.purpose)}</td><td class="mono">${esc(g.plate||"—")}</td><td>${esc(g.escort?short(g.escort):"—")}</td><td class="mono">${esc(g.tin||"—")} / ${esc(g.tout||"—")}</td><td><span class="pill ${GCLS[g.status]}">${g.status}</span></td>
    <td class="act">${g.status==="Requested"?`<button class="btn sm" style="background:var(--ok)" type="button" data-gs="${g.id}:Approved">Approve</button> `:""}${g.status==="Approved"?`<button class="btn sm" type="button" data-gs="${g.id}:Inside">Check in</button> `:""}${g.status==="Inside"?`<button class="btn sm" type="button" data-gs="${g.id}:Exited">Check out</button> `:""}<button class="icon-btn" type="button" data-edit="gate:${g.id}" aria-label="Edit">${PEN}</button></td></tr>`).join(""):`<tr><td colspan="10" class="empty">No gate entries match these filters.</td></tr>`}
  </tbody></table></div>`;
}

/* ---------- Staff ---------- */
let tf="open";
function vStaff(){

  const reps=[...state.reports].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  return `<div class="band"></div>
  <div class="head"><div><h2 class="title">Staff tasks &amp; reporting line</h2><p class="sub">Who the security team reports to, the shift rotation, assigned tasks and the end-of-shift reports. Teams A and B swap day and night shifts every week.</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" type="button" data-act="add-report">Write shift report</button><button class="btn" type="button" data-act="add-task">Assign task</button></div></div>
  ${sampleNotice()}
  <div class="grid g2">
    <div class="card">
      <h3>Reporting line <button class="btn ghost sm" type="button" data-act="edit-line" style="float:right">Edit</button></h3>
      <div class="org">
        <div class="orgnode"><b>CLS Management</b><span>Mogadishu</span></div>
        <div class="orgline"></div>
        <div class="side"><span class="spacer"></span><div class="orgnode"><b>${esc(state.settings.reportsTo)}</b><span>Security team reports here</span></div><div class="esc-wrap"><span class="dash"></span><div class="orgnode esc"><b>${esc(state.settings.escalation)}</b><span>Incident escalation</span></div></div></div>
        <div class="orgline"></div>
        <div class="orgrow">${state.members.map(m=>`<div class="orgnode" style="border-color:${m.c}">${av(m,30)}<b style="font-size:13.5px;margin-top:4px">${esc(m.name)}</b><span>${esc(m.role)} · Team ${m.team}</span></div>`).join("")}</div>
      </div>
      <ol style="margin:16px 0 0;padding-left:20px;color:var(--muted);font-size:13.5px;display:grid;gap:4px">
        <li>Security member on shift records the event and secures the area.</li>
        <li>Report to ${esc(state.settings.reportsTo)} straight away.</li>
        <li>Anything affecting power, cooling or network goes to ${esc(state.settings.escalation)} as well.</li>
        <li>Write it up in the end-of-shift report below.</li>
      </ol>
    </div>
    <div class="card" style="min-width:0">
      <h3>Shift rotation <small>this week</small></h3>
      <div class="tablewrap" style="border:0"><div class="roster">
        <div class="h">Member</div>${days.map(d=>`<div class="h${iso(d)===todayIso()?" today":""}">${WD[d.getDay()]} ${d.getDate()}</div>`).join("")}
        ${state.members.map(m=>`<div class="nm">${esc(m.name.split(" ")[0])} <span style="color:var(--muted);font-weight:400">${m.team}</span></div>${days.map(d=>{const s=shiftOf(m.id,d);return `<div><span class="sh ${s}">${s==="D"?"Day":"Night"}</span></div>`}).join("")}`).join("")}
      </div></div>
      <p style="font-size:13px;color:var(--muted);margin:10px 0 0">Day ${SHIFTS.D.split(" ")[1]}, night ${SHIFTS.N.split(" ")[1]}. Change a member's team with the Edit button on their card.</p>
    </div>
  </div>
  <h3>Security members</h3>
  <div class="grid g4">${state.members.map(m=>{const mt=state.tasks.filter(t=>t.member===m.id);const done=mt.filter(t=>t.status==="Done").length;const pct=mt.length?Math.round(done/mt.length*100):0;
    return `<div class="card member"><div class="top">${av(m)}<div style="min-width:0"><b>${esc(m.name)}</b><span style="font-size:13px;color:var(--muted)">${esc(m.role)}</span></div></div>
    <dl class="kv" style="margin:0"><dt>Team</dt><dd>${m.team} · ${SHIFTS[shiftOf(m.id,today())].split(" ")[0]} this week</dd><dt>Reports to</dt><dd>${esc(state.settings.reportsTo.split(",")[0])}</dd><dt>Phone</dt><dd class="mono">${esc(m.phone||"—")}</dd></dl>
    <div><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>Tasks done</span><span>${done} of ${mt.length}</span></div><div class="bar2" style="--c:var(--staff)"><i style="width:${pct}%"></i></div></div>
    <button class="btn ghost sm" type="button" data-edit="members:${m.id}" style="align-self:flex-start">Edit</button></div>`}).join("")}</div>

const PEN='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>';

/* ---------- Render ---------- */
function render(){
  renderTabs();
  const v={overview:vOverview,uniform:vUniform,gate:vGate,staff:vStaff}[cur];
  document.getElementById("view").innerHTML=v();
  if(cur==="overview")startRadar(); else stopRadar();
  tick();
}
const view=document.getElementById("view");
view.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="uq"){uq=e.target.value.toLowerCase();rerenderKeep(id)}
  if(id==="gq"){gq=e.target.value.toLowerCase();rerenderKeep(id)}
});
view.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="um"){um=e.target.value;render()}
  if(id==="gs"){gs=e.target.value;render()}
  if(id==="gd"){gd=e.target.value;render()}
  if(id==="tf"){tf=e.target.value;render()}
});
function rerenderKeep(id){const el=document.getElementById(id);const pos=el.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
view.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){go(g.dataset.go);return}
  const a=e.target.closest("[data-act]");
  if(a){const act=a.dataset.act;
    if(act==="clear-sample"){state.uniforms=[];state.gate=[];state.tasks=[];state.reports=[];state.members.forEach(m=>{m.passNo="";m.passExpiry=""});state.sample=false;save();render();toast("Sample records cleared")}
    if(act==="add-uniform")openForm("uniforms");
    if(act==="add-gate")openForm("gate");
    if(act==="add-task")openForm("tasks");
    if(act==="add-report")openForm("reports");
    if(act==="edit-line")openForm("settings","settings");
    if(act==="gd-clear"){gd="";render()}
    return}
  const ed=e.target.closest("[data-edit]"); if(ed){const [col,id]=ed.dataset.edit.split(":");openForm(col,id);return}
  const st=e.target.closest("[data-gs]"); if(st){const [id,s]=st.dataset.gs.split(":");const r=state.gate.find(x=>x.id===id);if(r){r.status=s;if(s==="Inside"&&!r.tin)r.tin=nowTime();if(s==="Exited"&&!r.tout)r.tout=nowTime();commit(s==="Approved"?"Clearance approved":s==="Inside"?"Checked in at "+r.tin:"Checked out at "+r.tout)}return}
  const dn=e.target.closest("[data-done]"); if(dn){const t=state.tasks.find(x=>x.id===dn.dataset.done);if(t){t.status="Done";commit("Task marked done")}}
});
function commit(msg){save();render();if(msg)toast(msg)}

    {k:"qty",l:"Quantity",t:"number",min:1},
    {k:"issued",l:"Date issued",t:"date",req:1},
    {k:"condition",l:"Condition",t:"select",o:CONDITION.map(s=>[s,s])}],
    blank:()=>({member:"m1",item:"Shirt",size:"L",qty:1,issued:todayIso(),condition:"New"})},
  gate:{title:"gate entry",c:"gate",fields:()=>[
    {k:"name",l:"Person or vehicle",req:1,full:1,ph:"e.g. Vendor engineer, Diesel tanker"},

    {k:"type",l:"Type",t:"select",o:GTYPES.map(s=>[s,s])},

    {k:"plate",l:"Vehicle plate"},

  tasks:{title:"task",c:"staff",fields:()=>[
    {k:"title",l:"Task",req:1,full:1,list:TASK_TEMPLATES},
    {k:"member",l:"Assigned to",t:"select",o:state.members.map(m=>[m.id,m.name])},
    {k:"due",l:"Due date",t:"date",req:1},
    {k:"priority",l:"Priority",t:"select",o:PRIORITY.map(s=>[s,s])},
    {k:"status",l:"Status",t:"select",o:TSTATUS.map(s=>[s,s])},
    {k:"note",l:"Notes",t:"textarea",full:1}],
    blank:()=>({title:"",member:"m1",due:todayIso(),priority:"Medium",status:"Open",note:""})},
  reports:{title:"shift report",c:"staff",fields:()=>[
    {k:"date",l:"Date",t:"date",req:1},
    {k:"shift",l:"Shift",t:"select",o:[["D","Day 06:00–18:00"],["N","Night 18:00–06:00"]]},
    {k:"member",l:"Reported by",t:"select",o:state.members.map(m=>[m.id,m.name])},
    {k:"incidents",l:"Incidents",t:"number",min:0},
    {k:"summary",l:"Summary",t:"textarea",full:1,req:1,ph:"Patrol times, visitors, anything unusual, hand-over notes"}],
    blank:()=>({date:todayIso(),shift:currentShift(),member:(onDutyNow()[0]||state.members[0]).id,incidents:0,summary:""})},
  members:{title:"security member",c:"staff",noDelete:1,fields:()=>[
    {k:"name",l:"Full name",req:1,full:1},
    {k:"role",l:"Role"},
    {k:"team",l:"Shift team",t:"select",o:[["A","Team A"],["B","Team B"]]},
    {k:"phone",l:"Phone"},
    {k:"passNo",l:"Airport pass number"},
    {k:"passExpiry",l:"Airport pass expiry",t:"date"}]},
  settings:{title:"reporting line",c:"staff",noDelete:1,fields:()=>[
    {k:"reportsTo",l:"Security team reports to",req:1,full:1},
    {k:"escalation",l:"Incident escalation",req:1,full:1}]}
};
const bd=document.getElementById("backdrop"), md=document.getElementById("modal");
let editing=null;
function openForm(col,id){
  const F=FORMS[col];
  const rec=col==="settings"?{...state.settings}:id?{...(state[col].find(r=>r.id===id)||{})}:F.blank();
  editing={col,id};
  md.style.borderTopColor=`var(--${F.c})`;
  md.innerHTML=`<header><h4>${id?"Edit":"Add"} ${F.title}</h4><button class="icon-btn" type="button" data-close aria-label="Close">✕</button></header>
  <form id="frm" novalidate><div class="body"><div class="form">${F.fields().map(f=>{
    const v=rec[f.k]==null?"":rec[f.k], fid="f_"+f.k, req=f.req?" required":"";
    let input;
    if(f.t==="select")input=`<select id="${fid}" name="${f.k}">${f.o.map(([val,lab])=>`<option value="${esc(val)}"${String(val)===String(v)?" selected":""}>${esc(lab)}</option>`).join("")}</select>`;
    else if(f.t==="textarea")input=`<textarea id="${fid}" name="${f.k}"${req} placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`;
    else input=`<input id="${fid}" name="${f.k}" type="${f.t||"text"}"${f.min!=null?` min="${f.min}"`:""} value="${esc(v)}"${req} placeholder="${esc(f.ph||"")}"${f.list?` list="${fid}_l"`:""}>${f.list?`<datalist id="${fid}_l">${f.list.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:""}`;
    return `<label class="${f.full?"full":""}" for="${fid}">${f.l}${f.req?" *":""}${input}</label>`}).join("")}</div>
    <p id="ferr" style="color:var(--bad);font-size:13.5px;margin:10px 0 0" hidden></p></div>
  <footer>${id&&!F.noDelete?`<button type="button" class="btn danger sm left" id="delBtn">Delete</button>`:""}<button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn" style="background:var(--${F.c})">Save</button></footer></form>`;
  bd.classList.add("open");
  setTimeout(()=>{const f=md.querySelector("input,select,textarea");if(f)f.focus()},30);
}
function closeForm(){bd.classList.remove("open");editing=null}
bd.addEventListener("click",e=>{
  if(e.target===bd||e.target.closest("[data-close]")){closeForm();return}
  if(e.target.id==="delBtn"){
    if(e.target.dataset.sure){const {col,id}=editing;state[col]=state[col].filter(r=>r.id!==id);closeForm();commit("Deleted")}
    else{e.target.dataset.sure="1";e.target.textContent="Tap again to delete"}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&bd.classList.contains("open"))closeForm()});
md.addEventListener("submit",e=>{
  e.preventDefault();
  const {col,id}=editing, F=FORMS[col], fr=e.target, out={};
  let missing=[];
  F.fields().forEach(f=>{const el=fr.elements[f.k];let v=el.value.trim();if(f.t==="number")v=v===""?0:Number(v);out[f.k]=v;if(f.req&&(v===""||v==null))missing.push(f.l)});
  if(missing.length){const p=document.getElementById("ferr");p.hidden=false;p.textContent="Fill in: "+missing.join(", ")+".";return}
  if(col==="settings")Object.assign(state.settings,out);
  else if(id){const r=state[col].find(x=>x.id===id);Object.assign(r,out)}
  else state[col].push({id:uid(),...out});
  closeForm();commit("Saved");
});
let tt; function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}

/* ---------- Clock ---------- */
function tick(){
  const p=nowParts(), t=String(p.h).padStart(2,"0")+":"+String(p.mi).padStart(2,"0")+":"+String(p.s).padStart(2,"0");
  const d=today(), txt=WD[d.getDay()]+" "+fd(d)+" · "+t+" EAT";
  document.getElementById("clock").textContent=txt;
  const h=document.getElementById("heroClock"); if(h)h.textContent=t+" EAT";
}
let lastShift=currentShift(), lastDay=todayIso();
setInterval(()=>{tick();if(currentShift()!==lastShift||todayIso()!==lastDay){lastShift=currentShift();lastDay=todayIso();if(!bd.classList.contains("open"))render()}},1000);

/* ---------- Hero radar sweep ---------- */
let raf=null;
function startRadar(){
  stopRadar();
  const cv=document.getElementById("radar"); if(!cv)return;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ctx=cv.getContext("2d"); let a=0;
  const blips=[[.62,.3],[.8,.55],[.7,.78],[.9,.25]];
  function frame(){
    const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    if(cv.width!==Math.round(r.width*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
    const cx=W*.86, cy=H*.28, R=Math.max(W,H)*.55;
    ctx.strokeStyle="rgba(157,181,195,.13)"; ctx.lineWidth=1*dpr;
    for(let i=1;i<=5;i++){ctx.beginPath();ctx.arc(cx,cy,R*i/5,0,Math.PI*2);ctx.stroke()}
    ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
    const g=ctx.createConicGradient?ctx.createConicGradient(a-0.9,cx,cy):null;
    if(g){g.addColorStop(0,"rgba(243,179,90,0)");g.addColorStop(.14,"rgba(243,179,90,.16)");g.addColorStop(.145,"rgba(243,179,90,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill()}
    blips.forEach(([x,y])=>{const bx=W*x,by=H*y;const ang=(Math.atan2(by-cy,bx-cx)+Math.PI*2)%(Math.PI*2);const dlt=((a%(Math.PI*2))-ang+Math.PI*2)%(Math.PI*2);const al=Math.max(.15,1-dlt/3);ctx.fillStyle=`rgba(125,226,168,${al*.8})`;ctx.beginPath();ctx.arc(bx,by,3*dpr,0,Math.PI*2);ctx.fill()});
    a+=0.012; if(!reduce)raf=requestAnimationFrame(frame);
  }
  frame();
}
function stopRadar(){if(raf)cancelAnimationFrame(raf);raf=null}

/* ---------- Theme ---------- */
const TK="cls-security-theme";
function applyTheme(t){
  const root=document.documentElement;
  if(t==="light"||t==="dark")root.setAttribute("data-theme",t); else root.removeAttribute("data-theme");
  document.querySelectorAll(".theme button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===t)));
}
let theme=null; try{theme=localStorage.getItem(TK)}catch(e){}
if(theme)applyTheme(theme); else{const cur=document.documentElement.getAttribute("data-theme")||"system";document.querySelectorAll(".theme button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===cur)))}
document.querySelector(".theme").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;theme=b.dataset.t;applyTheme(theme);try{localStorage.setItem(TK,theme)}catch(e){}});

render();
})();
